name: Check upstream asciidoctor-kroki gem

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get current tracked version
        id: current
        run: |
          version=$(grep -oP 'UPSTREAM_VERSION\s*=\s*"\K[^"]+' src/asciidoctor_kroki.cr)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get latest upstream version
        id: upstream
        run: |
          response=$(curl -s https://rubygems.org/api/v1/gems/asciidoctor-kroki.json)
          version=$(echo "$response" | jq -r '.version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create issue if new version detected
        if: steps.current.outputs.version != steps.upstream.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          existing=$(gh issue list --label upstream --search "Upstream asciidoctor-kroki gem updated to ${UPSTREAM_VERSION}" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then exit 0; fi
          gh issue create \
            --title "Upstream asciidoctor-kroki gem updated to ${UPSTREAM_VERSION}" \
            --body "New version **${UPSTREAM_VERSION}** (current: \`${CURRENT_VERSION}\`). [RubyGems](https://rubygems.org/gems/asciidoctor-kroki)" \
            --label "upstream"
