name: asciicrystal-kroki
version: 0.10.2.6

description: |
  Asciidoctor extension for rendering diagrams via the Kroki.io API.
  Crystal port of the asciidoctor-kroki Ruby gem (v0.10.2).

authors:
  - Philippe Nenert <philippe@aloli.fr>

license: MIT

dependencies:
  asciicrystal:
    github: aloli-crystal/asciicrystal
    version: "~> 2.0.26.12"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  asciicrystal-kroki:
    main: src/cli.cr

crystal: ">= 1.19.0"
